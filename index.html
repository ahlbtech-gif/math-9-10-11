<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAPLAN-Style Math Test App 3-12</title>
<style>
body { margin:0; font-family: Arial, sans-serif; background:#eef2f7; }
header { background:#4CAF50; color:white; text-align:center; padding:15px; font-size:1.3em; font-weight:bold; }
.container { max-width:900px; margin:auto; padding:20px; }
button { padding:10px 15px; margin:5px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
.grade-btn { background:#2196F3; color:white; }
.grade-btn.selected { background:#ff9800; }
#quiz { margin-top:20px; }
.question { margin:15px 0; font-size:1.1em; }
input[type="text"] { padding:8px; width:80px; margin-top:5px; }
.timer { font-size:20px; color:red; text-align:center; margin-top:10px; }
.progress-bar { width:100%; background:#ddd; border-radius:10px; height:20px; margin:15px 0; }
.progress { height:100%; width:0%; background:#4CAF50; border-radius:10px; text-align:center; color:white; line-height:20px; }
#solution, #report { background:#f1f1f1; padding:10px; margin-top:10px; white-space: pre-line; display:none; }
canvas { border:1px solid #ccc; margin-top:10px; }
</style>
</head>
<body>

<header>Ba mẹ yêu con Linh-Brian</header>

<div class="container">
<h2>NAPLAN-Style Math Test</h2>
<p>Select Grade:</p>
<button class="grade-btn" onclick="setGrade(3)" id="g3">3</button>
<button class="grade-btn" onclick="setGrade(5)" id="g5">5</button>
<button class="grade-btn" onclick="setGrade(7)" id="g7">7</button>
<button class="grade-btn" onclick="setGrade(9)" id="g9">9</button>
<button class="grade-btn" onclick="setGrade(10)" id="g10">10</button>
<button class="grade-btn" onclick="setGrade(11)" id="g11">11</button>
<button class="grade-btn" onclick="setGrade(12)" id="g12">12</button>

<div class="timer">Time: <span id="time">65:00</span></div>
<div class="progress-bar"><div class="progress" id="progress">0%</div></div>

<div id="quiz"></div>
<button onclick="submitTest()" id="submitBtn" style="display:none;">Submit Test</button>
<button onclick="showAllSolutions()" id="showSolBtn" style="display:none;">Show All Solutions</button>

<div id="report"></div>
<div id="solution"></div>
</div>

<script>
// ---------------- VARIABLES ----------------
let grade, questions=[], answers=[], solutions=[], topicsUsed=[], currentQ=0, difficulty=1, timerInterval, time=65*60, userAnswers=[];

// ---------------- RANDOM HELPER ----------------
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}

// ---------------- ALLOWED TOPICS PER GRADE ----------------
const allowedTopics = {
  3: ["Number","Geometry","Word Problem","Fractions","Time","Money","Measurement"],
  5: ["Number","Geometry","Word Problem","Fractions","Decimals","Data Interpretation","Measurement"],
  7: ["Number","Geometry","Word Problem","Algebra","Ratios","Probability","Data Interpretation"],
  9: ["Number","Algebra","Geometry","Word Problem","Functions","Trigonometry","Probability","Data Interpretation"],
  10:["Number","Algebra","Geometry","Word Problem","Functions","Trigonometry","Probability","Data Interpretation"],
  11:["Number","Algebra","Geometry","Word Problem","Functions","Trigonometry","Probability","Data Interpretation","Calculus"],
  12:["Number","Algebra","Geometry","Word Problem","Functions","Trigonometry","Probability","Data Interpretation","Calculus"]
};

// ---------------- QUESTION BANKS (~1000 each grade, mock NAPLAN-style) ----------------
const questionBank = {};
[3,5,7,9,10,11,12].forEach(g=>{
    questionBank[g]=[];
    let topics = allowedTopics[g];
    for(let i=1;i<=1000;i++){
        let topic = topics[rand(0,topics.length-1)];
        let val=rand(1,50);
        let qText="", a=0, s="";
        switch(topic){
            case "Number": qText=`What is ${val} + ${rand(1,50)}?`; a=val+rand(1,50); s=`Add numbers step by step`; break;
            case "Fractions": qText=`Simplify the fraction ${rand(1,10)*2}/${rand(1,10)*2}`; a="simplified"; s=`Divide numerator and denominator by GCD`; break;
            case "Decimals": qText=`Add ${val/10} + ${rand(1,50)/10}`; a=val/10+rand(1,50)/10; s=`Add decimals`; break;
            case "Time": qText=`What time is ${val}:00 + ${rand(1,5)} hours?`; a="time answer"; s=`Add hours to time`; break;
            case "Money": qText=`John buys ${val} items at $${rand(1,10)} each. Total cost?`; a=val*rand(1,10); s=`Multiply quantity by price`; break;
            case "Measurement": qText=`A rod is ${val}cm, add ${rand(1,20)}cm. Total?`; a=val+rand(1,20); s=`Add measurements`; break;
            case "Geometry": qText=`A rectangle with length ${val} and width ${rand(1,20)}. Find area.`; a=val*rand(1,20); s=`Area = length*width`; break;
            case "Data Interpretation": qText=`Table shows scores: ${val},${val+1},${val+2}. Find average.`; a=(val+val+1+val+2)/3; s=`Average = sum/3`; break;
            case "Algebra": qText=`Solve x + ${val} = ${val+rand(1,10)}`; a=rand(1,10); s=`Subtract ${val} from both sides`; break;
            case "Functions": qText=`If f(x)=${val}x, find f(${rand(1,10)})`; a=val*rand(1,10); s=`Multiply f by input`; break;
            case "Trigonometry": qText=`Find sin(${rand(0,90)}°)`; a=rand(0,1); s=`Use sin formula`; break;
            case "Probability": qText=`Probability of head in coin toss?`; a=0.5; s=`1/2`; break;
            case "Calculus": qText=`Differentiate ${val}x^2`; a=2*val+"x"; s=`Use power rule`; break;
            case "Ratios": qText=`Simplify ratio ${val}:${rand(1,20)}`; a="simplified ratio"; s=`Divide both numbers by GCD`; break;
            case "Word Problem": qText=`John buys ${val} pencils at $${rand(1,5)} each. Total cost?`; a=val*rand(1,5); s=`Multiply quantity by price`; break;
        }
        questionBank[g].push({q:qText,a:a,s:s,t:topic});
    }
});

// ---------------- SELECT GRADE ----------------
function setGrade(g){
    grade=g;
    document.querySelectorAll('.grade-btn').forEach(b=>b.classList.remove('selected'));
    document.getElementById('g'+g).classList.add('selected');
    generateTest();
    startTimer(time);
}

// ---------------- GENERATE TEST ----------------
function generateTest(){
    questions=[], answers=[], solutions=[], topicsUsed=[], currentQ=0, difficulty=1, userAnswers=[];
    let bank=questionBank[grade];
    let usedIndexes=new Set();
    for(let i=0;i<40;i++){
        let idx;
        do{ idx=rand(0,bank.length-1); }while(usedIndexes.has(idx));
        usedIndexes.add(idx);
        let obj=bank[idx];
        questions.push(obj.q);
        answers.push(obj.a);
        solutions.push(obj.s);
        topicsUsed.push(obj.t);
    }
    renderQuestion();
    document.getElementById("submitBtn").style.display="none";
    document.getElementById("showSolBtn").style.display="none";
    document.getElementById("report").style.display="none";
    document.getElementById("solution").style.display="none";
}

// ---------------- RENDER QUESTION ----------------
function renderQuestion(){
    let i=currentQ;
    let qHTML=`<div class="question">Q${i+1}: ${questions[i]}</div><input type="text" id="ansInput">`;
    if(topicsUsed[i]==="Geometry"){
        qHTML+=`<canvas id="canvas${i}" width="200" height="100"></canvas>`;
        setTimeout(()=>drawCanvas(i),50);
    }
    document.getElementById("quiz").innerHTML=qHTML+`<button onclick="checkAnswer()">Submit Answer</button>`;
    updateProgress();
}

// ---------------- DRAW CANVAS ----------------
function drawCanvas(i){
    let c=document.getElementById("canvas"+i); if(!c) return;
    let ctx=c.getContext("2d");
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle="#4CAF50"; ctx.fillRect(20,20,160,60);
    ctx.strokeStyle="#000"; ctx.strokeRect(20,20,160,60);
}

// ---------------- CHECK ANSWER ----------------
function checkAnswer(){
    let user=document.getElementById("ansInput").value;
    userAnswers.push(user);
    let correct = Math.abs(user - answers[currentQ])<0.01 || user.toString().toLowerCase()==answers[currentQ].toString().toLowerCase();
    if(correct) difficulty=Math.min(3,difficulty+0.5); else difficulty=Math.max(1,difficulty-0.5);
    currentQ++;
    if(currentQ<questions.length) renderQuestion();
    else finishTest();
}

// ---------------- FINISH TEST ----------------
function finishTest(){
    clearInterval(timerInterval);
    document.getElementById("time").innerText="Finished";
    let score=0, topicErrors={};
    for(let i=0;i<questions.length;i++){
        if(Math.abs(userAnswers[i]-answers[i])<0.01 || userAnswers[i].toString().toLowerCase()==answers[i].toString().toLowerCase()) score++;
        else { topicErrors[topicsUsed[i]]=(topicErrors[topicsUsed[i]]||0)+1; }
    }
    let reportText=`Score: ${score}/${questions.length}\n`;
    if(Object.keys(topicErrors).length>0){
        reportText+="Topics to improve:\n";
        for(let t in topicErrors) reportText+=`${t}: ${topicErrors[t]} question(s) wrong\n`;
    }
    document.getElementById("quiz").innerHTML="";
    document.getElementById("submitBtn").style.display="block";
    document.getElementById("showSolBtn").style.display="block";
    document.getElementById("report").style.display="block";
    document.getElementById("report").innerText=reportText;
}

// ---------------- SHOW ALL SOLUTIONS ----------------
function showAllSolutions(){
    let sol="";
    solutions.forEach((s,i)=>sol+=`Q${i+1}: ${s}\n\n`);
    document.getElementById("solution").style.display="block";
    document.getElementById("solution").innerText=sol;
}

// ---------------- TIMER ----------------
function startTimer(sec){
    clearInterval(timerInterval); time=sec;
    timerInterval=setInterval(()=>{
        let m=Math.floor(time/60), s=time%60;
        document.getElementById("time").innerText=`${m}:${s<10?'0':''}${s}`;
        if(time>0) time--; else { clearInterval(timerInterval); finishTest(); }
    },1000);
}

// ---------------- PROGRESS ----------------
function updateProgress(){
    let p = Math.round((currentQ/questions.length)*100);
    let prog=document.getElementById("progress");
    prog.style.width=p+'%';
    prog.innerText=p+'%';
}
</script>
</body>
</html>
