<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHLB Math App PRO</title>

<!-- PWA -->
<link rel="manifest" href="data:application/json,{
'name':'AHLB Math App',
'short_name':'AHLB',
'start_url':'.',
'display':'standalone',
'background_color':'#ffffff',
'theme_color':'#4CAF50'
}">

<style>
body{font-family:Arial;margin:0;background:#f4f6f9;}
header{background:#4CAF50;color:#fff;text-align:center;padding:15px;font-weight:bold;}
.container{max-width:900px;margin:auto;padding:20px;}

.question{font-size:18px;margin-bottom:15px;}
.options button{
display:block;width:100%;margin:8px 0;padding:10px;
border-radius:8px;border:1px solid #ccc;background:#fff;
}
.options button.selected{background:#4CAF50;color:white;}

canvas{border:1px solid #ccc;margin:10px auto;display:block;}

.timer{text-align:center;color:red;}
.progress{background:#4CAF50;height:20px;color:#fff;text-align:center;}
.bar{background:#ddd;height:20px;border-radius:10px;}

button{padding:10px;margin:5px;border:none;border-radius:8px;background:#2196F3;color:white;}
</style>
</head>

<body>

<header>Ba mẹ yêu con Linh-Brian</header>

<div class="container">

<h2>NAPLAN Adaptive Math</h2>

<select id="grade">
<option value="5">Grade 5</option>
<option value="7">Grade 7</option>
<option value="9">Grade 9</option>
<option value="11">Grade 11</option>
</select>

<button onclick="start()">Start</button>

<div class="timer">Time: <span id="time">65:00</span></div>
<div class="bar"><div id="progress" class="progress">0%</div></div>

<div id="quiz"></div>

<button onclick="next()">Next</button>
<button onclick="finish()">Finish</button>
<button onclick="showHistory()">History</button>

<div id="result"></div>
<div id="history"></div>

</div>

<script>
let test=[], current=0, score=0, timer;
let difficulty=1;

// ===== RANDOM =====
function r(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

// ===== GENERATE QUESTIONS =====
function gen(g){

// ===== BAR CHART =====
let data=[r(5,20),r(5,20),r(5,20)];

return {
q:`Which bar is highest?`,
draw:()=>{
let c=document.getElementById("chart");
let ctx=c.getContext("2d");
ctx.clearRect(0,0,300,150);
data.forEach((v,i)=>{
ctx.fillRect(i*80+20,150-v*5,40,v*5);
});
},
options:["A","B","C","Equal"],
correct:data.indexOf(Math.max(...data)),
topic:"Graph",
sol:`Compare heights`
};
}

// ===== READING =====
function readingQ(){
let apples=r(10,50), sold=r(5,10);
return {
q:`A shop has ${apples} apples. It sells ${sold}. How many left?`,
options:[apples-sold,apples-sold+1,apples-sold-1,apples],
correct:0,
topic:"Word Problem",
sol:`${apples}-${sold}=${apples-sold}`
};
}

// ===== START =====
function start(){
test=[];
for(let i=0;i<40;i++){
if(Math.random()<0.5) test.push(gen());
else test.push(readingQ());
}

current=0; score=0;
render();
timerStart();
}

// ===== RENDER =====
function render(){
let q=test[current];

let html=`<div class="question">Q${current+1}: ${q.q}</div>`;

if(q.draw){
html+=`<canvas id="chart" width="300" height="150"></canvas>`;
}

html+=`<div class="options">`;

q.options.forEach((opt,i)=>{
html+=`<button onclick="select(${i})" id="o${i}">${opt}</button>`;
});

html+=`</div>`;

document.getElementById("quiz").innerHTML=html;

if(q.draw) q.draw();

updateProgress();
}

// ===== SELECT =====
let selected=null;
function select(i){
selected=i;
for(let j=0;j<4;j++){
document.getElementById("o"+j).classList.remove("selected");
}
document.getElementById("o"+i).classList.add("selected");
}

// ===== NEXT =====
function next(){
if(selected===null){alert("Select answer");return;}

if(selected==test[current].correct){
score++; difficulty++;
}else{
difficulty=Math.max(1,difficulty-1);
}

test[current].user=selected;

current++;
if(current<40) render();
else finish();
}

// ===== TIMER =====
function timerStart(){
let t=65*60;
clearInterval(timer);
timer=setInterval(()=>{
t--;
let m=Math.floor(t/60), s=t%60;
document.getElementById("time").innerText=`${m}:${s<10?'0'+s:s}`;
if(t<=0) finish();
},1000);
}

// ===== PROGRESS =====
function updateProgress(){
let p=Math.floor((current/40)*100);
let el=document.getElementById("progress");
el.style.width=p+"%";
el.innerText=p+"%";
}

// ===== FINISH =====
function finish(){
clearInterval(timer);

document.getElementById("result").innerHTML=`Score: ${score}/40`;

saveHistory(score);
}

// ===== SAVE HISTORY =====
function saveHistory(s){
let h=JSON.parse(localStorage.getItem("ahlb")||"[]");
h.push({date:new Date().toLocaleString(),score:s});
localStorage.setItem("ahlb",JSON.stringify(h));
}

// ===== SHOW HISTORY =====
function showHistory(){
let h=JSON.parse(localStorage.getItem("ahlb")||"[]");
let html="<h3>History</h3>";
h.forEach(x=>{
html+=`<p>${x.date} - Score: ${x.score}</p>`;
});
document.getElementById("history").innerHTML=html;
}
</script>

</body>
</html>
